# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Generate coverage report
        run: mvn -B jacoco:report

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4   # or @v5 if available in the marketplace
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore