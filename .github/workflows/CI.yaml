# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Full suite — a failing test fails the job (and blocks merge if this check is required).
      - name: Run tests
        run: mvn -B test

      # Report only — do not run -Pcoverage-gate (100% branch is not required in CI).
      - name: Generate coverage report
        run: mvn -B jacoco:report

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore